name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# least privilege for the GITHUB_TOKEN (checkout only)
permissions:
  contents: read

jobs:
  build:

    # pinned : gdal-bin comes from the distribution (GDAL 3.12.2 on ubuntu 26.04, as in the Dockerfile)
    runs-on: ubuntu-26.04

    # 21 : minimum supported version (gpu-site), 25 : version of the Docker image
    strategy:
      fail-fast: false
      matrix:
        java: [ '21', '25' ]
    name: build (java ${{ matrix.java }})

    # PostGIS for the DGPR controls (skipped with SQLITE)
    services:
      postgis:
        image: postgis/postgis:17-3.4
        env:
          POSTGRES_USER: postgis
          POSTGRES_PASSWORD: postgis
          POSTGRES_DB: validator
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v7

    - name: Set up java
      uses: actions/setup-java@v6
      with:
        java-version: ${{ matrix.java }}
        distribution: 'temurin'
        cache: maven

    - name: Install ogr2ogr
      run: |
        sudo apt-get update -qq
        sudo apt-get -y install gdal-bin
        which ogr2ogr

    - name: Build and test
      run: bash .ci/build.sh

    - name: Test DGPR controls with PostGIS
      env:
        DB_URL: jdbc:postgresql://localhost:5432/validator
        DB_USER: postgis
        DB_PASSWORD: postgis
      run: mvn -B install -Dmaven.test.skip=true -q && mvn -B test -pl validator-plugin-dgpr -Dtest=DgprApplicationTest
